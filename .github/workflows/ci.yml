name: Vooye CI

on:
  pull_request:
    paths:
      - "vooye-production/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, upgrade/prisma-7]
    paths:
      - "vooye-production/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vooye-production

    # Prisma 7 loads prisma.config.ts during npm install's postinstall.
    # Client generation does not connect to the database, so use CI-only
    # placeholder URLs rather than production database credentials.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/vooye?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/vooye?schema=public
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: vooye-ci
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
      FIREBASE_ADMIN_PROJECT_ID: vooye-ci
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: placeholder
      RAZORPAY_WEBHOOK_SECRET: placeholder
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
      SHIPPING_FLAT_FEE_PAISE: "9900"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vooye-production/package-lock.json

      - name: Install dependencies
        # Keep CI aligned with the package manifest when the lockfile is stale.
        # A regenerated package-lock.json should be committed separately so CI can return to npm ci.
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
