name: Validate Vooye

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vooye-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
          DIRECT_URL: postgresql://test:test@localhost:5432/test?schema=public
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: vooye-ci
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
          FIREBASE_ADMIN_PROJECT_ID: vooye-ci
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          RAZORPAY_KEY_ID: rzp_test_placeholder
          RAZORPAY_KEY_SECRET: placeholder
          RAZORPAY_WEBHOOK_SECRET: placeholder
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
          SHIPPING_FLAT_FEE_PAISE: "9900"