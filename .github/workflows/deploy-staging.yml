name: Deploy Vooye staging to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vooye-staging-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  REPOSITORY: ${{ vars.REPOSITORY }}
  SERVICE: vooye-staging
  RUNTIME_SERVICE_ACCOUNT: vooye-staging-runtime@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: vooye-production
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/vooye?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/vooye?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vooye-production/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint, typecheck, and test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Validate staging configuration
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          STAGING_NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.STAGING_NEXT_PUBLIC_FIREBASE_API_KEY }}
          STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          STAGING_FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.STAGING_NEXT_PUBLIC_FIREBASE_APP_ID }}
          STAGING_NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID }}
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION REPOSITORY WIF_PROVIDER WIF_SERVICE_ACCOUNT STAGING_NEXT_PUBLIC_FIREBASE_API_KEY STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN STAGING_FIREBASE_PROJECT_ID STAGING_NEXT_PUBLIC_FIREBASE_APP_ID STAGING_NEXT_PUBLIC_SUPABASE_URL STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error title=Missing staging configuration::$name is empty. Add it under Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done
          if [[ "$STAGING_NEXT_PUBLIC_SUPABASE_URL" != *"qpkjmyasfudoosvfztit"* ]]; then
            echo "::error::STAGING_NEXT_PUBLIC_SUPABASE_URL must point to the vooye-stage Supabase project."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push staging image
        env:
          STAGING_NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.STAGING_NEXT_PUBLIC_FIREBASE_API_KEY }}
          STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          STAGING_FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.STAGING_NEXT_PUBLIC_FIREBASE_APP_ID }}
          STAGING_NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/vooye-frontend:staging-$GITHUB_SHA"
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$STAGING_NEXT_PUBLIC_FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$STAGING_FIREBASE_PROJECT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$STAGING_NEXT_PUBLIC_FIREBASE_APP_ID" \
            --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID="$STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$STAGING_NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy staging service with checkout disabled
        env:
          STAGING_FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.STAGING_NEXT_PUBLIC_FIREBASE_API_KEY }}
          STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          STAGING_NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.STAGING_NEXT_PUBLIC_FIREBASE_APP_ID }}
          STAGING_NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          STAGING_ADMIN_UIDS: ${{ vars.STAGING_ADMIN_UIDS }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "FIREBASE_ADMIN_PROJECT_ID=$STAGING_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_API_KEY=$STAGING_NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID=$STAGING_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_APP_ID=$STAGING_NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_RAZORPAY_KEY_ID=$STAGING_NEXT_PUBLIC_RAZORPAY_KEY_ID,NEXT_PUBLIC_SUPABASE_URL=$STAGING_NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,SUPABASE_COMMERCE_CHECKOUT_READY=false,CHECKOUT_ENABLED=false,INVENTORY_EXPIRY_JOB_ENABLED=false,PAYMENT_RECONCILIATION_ENABLED=false,STAGING_MODE=true,ADMIN_UIDS=$STAGING_ADMIN_UIDS" \
            --set-secrets "DATABASE_URL=vooye-staging-database-url:latest,DIRECT_URL=vooye-staging-direct-url:latest,SUPABASE_SERVICE_ROLE_KEY=vooye-staging-supabase-service-role-key:latest,RAZORPAY_KEY_ID=vooye-razorpay-test-key-id:latest,RAZORPAY_KEY_SECRET=vooye-razorpay-test-key-secret:latest,RAZORPAY_WEBHOOK_SECRET=vooye-razorpay-test-webhook-secret:latest,CRON_SECRET=vooye-staging-cron-secret:latest" \
            --quiet

          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          if [[ -z "$SERVICE_URL" ]]; then
            echo "::error::Cloud Run did not return the staging service URL."
            exit 1
          fi
          gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --update-env-vars "SITE_URL=$SERVICE_URL" --quiet
          echo "STAGING_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Smoke test staging
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --max-time 10 -w '%{http_code}' "$STAGING_URL/api/health" -o /tmp/vooye-staging-health.json || true)"
            if [[ "$status" == "200" ]] && jq -e '.status == "ok" and .dependencies.database == "ok"' /tmp/vooye-staging-health.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "Staging health attempt $attempt/18 returned HTTP ${status:-unknown}; retrying in 5 seconds."
            sleep 5
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Staging deployment did not pass the database-backed health check."
            jq -c '{status,service,dependencies,timestamp}' /tmp/vooye-staging-health.json 2>/dev/null || true
            exit 1
          fi
          curl --silent --show-error --fail --max-time 10 "$STAGING_URL/api/checkout/status" -o /tmp/vooye-staging-checkout.json
          jq -e '.enabled == false' /tmp/vooye-staging-checkout.json >/dev/null
          echo "Staging smoke tests passed: $STAGING_URL"
