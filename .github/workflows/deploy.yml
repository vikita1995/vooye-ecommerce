name: Deploy Vooye to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: vooye-510916
  REGION: asia-south1
  SERVICE: vooye-frontend
  IMAGE: asia-south1-docker.pkg.dev/vooye-510916/vooye-app/vooye-frontend

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vooye-marketplace/package-lock.json

      - name: Install dependencies
        working-directory: vooye-marketplace
        run: npm ci

      - name: Type check
        working-directory: vooye-marketplace
        run: npm run typecheck

      - name: Lint
        working-directory: vooye-marketplace
        run: npm run lint

      - name: Build Next.js
        working-directory: vooye-marketplace
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: vooye-510916
          workload_identity_provider: projects/711893761385/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: vooye-github-deployer@vooye-510916.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: vooye-510916

      - name: Configure Docker authentication
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build container image
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            ./vooye-marketplace

      - name: Push container image
        run: docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --platform=managed \
            --image="${IMAGE}:${GITHUB_SHA}" \
            --service-account="vooye-runtime@vooye-510916.iam.gserviceaccount.com" \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min=0 \
            --max=3 \
            --allow-unauthenticated \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format="value(status.url)"