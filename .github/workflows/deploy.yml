name: Deploy Vooye to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "vooye-production/**"
      - ".github/workflows/deploy.yml"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vooye-production-deploy
  # Do not cancel a deployment midway; only the latest pending deployment is retained.
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  REPOSITORY: ${{ vars.REPOSITORY }}
  SERVICE: ${{ vars.SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: vooye-production

    # Only non-production placeholders are used for the pre-deployment checks.
    # Production secrets remain in the Cloud Run configuration / Secret Manager.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/vooye?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/vooye?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vooye-production/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Validate deployment configuration
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION REPOSITORY SERVICE WIF_PROVIDER WIF_SERVICE_ACCOUNT NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_APP_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error title=Missing GitHub Actions variable::$name is empty. Configure it under Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done

          # Storefront deployments are allowed while Razorpay checkout is intentionally disabled.
          # The server-side isCheckoutReady() gate remains closed when this public key is absent.
          if [[ -z "${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}" ]]; then
            echo "::warning title=Razorpay checkout remains disabled::NEXT_PUBLIC_RAZORPAY_KEY_ID is empty. Configure the public Razorpay key and complete checkout go-live checks before enabling checkout."
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/vooye-frontend:$GITHUB_SHA"
          docker build             --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY"             --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"             --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID"             --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$NEXT_PUBLIC_FIREBASE_APP_ID"             --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID="$NEXT_PUBLIC_RAZORPAY_KEY_ID"             --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"             --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"             -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE"             --image "$IMAGE"             --project "$PROJECT_ID"             --region "$REGION"             --platform managed             --allow-unauthenticated             --port 8080             --quiet

      - name: Smoke test deployed Cloud Run revision
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          if [[ -z "$SERVICE_URL" ]]; then
            echo "::error::Cloud Run did not return a service URL."
            exit 1
          fi

          # Capture both HTTP status and response body so failures are diagnosable in Actions.
          # Do not print connection strings or environment values; the health route redacts them.
          ready=0
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --max-time 10 \
              -w '%{http_code}' "$SERVICE_URL/api/health" -o /tmp/vooye-health.json || true)"
            if [[ "$status" == "200" ]] \
              && jq -e '.status == "ok" and .dependencies.database == "ok"' /tmp/vooye-health.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "Health check attempt $attempt/18 returned HTTP ${status:-unknown}; retrying in 5 seconds."
            sleep 5
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Cloud Run smoke test failed. The service was deployed but did not pass its database-backed health check."
            echo "Health response (expected to contain only redacted status/dependency fields):"
            jq -c '{status, service, dependencies, timestamp}' /tmp/vooye-health.json 2>/dev/null || echo "No valid JSON health response was returned."
            echo "Recent Cloud Run application errors for the new revision:"
            gcloud logging read \
              'resource.type="cloud_run_revision" AND resource.labels.service_name="'$SERVICE'" AND resource.labels.location="'$REGION'" AND severity>=ERROR' \
              --project "$PROJECT_ID" --limit=30 --format='value(timestamp,textPayload,jsonPayload.message)' || true
            exit 1
          fi

          # Confirm the public checkout status endpoint is reachable and returns its expected contract.
          curl --silent --show-error --fail --max-time 10 "$SERVICE_URL/api/checkout/status" -o /tmp/vooye-checkout.json
          jq -e '(.enabled | type) == "boolean" and (.message | type) == "string"' /tmp/vooye-checkout.json >/dev/null
          echo "Cloud Run smoke tests passed for $SERVICE_URL"

      - name: Setup Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Hosting
        working-directory: .
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: |
          set -euo pipefail
          firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
